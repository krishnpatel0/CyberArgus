<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Argus module ownership map</title><desc id="desc">Mapping between backend module directories, frontend directories, tests, and shared platform boundaries.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#121f2d"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6f899a"/></marker><style>.h{font:700 34px Inter,Segoe UI,sans-serif;fill:#f7fafc}.sub{font:16px Inter,Segoe UI,sans-serif;fill:#9fb2c3}.head{font:700 14px Inter,Segoe UI,sans-serif;letter-spacing:1.5px;fill:#87a4b6}.box{fill:#132535;stroke:#355166;stroke-width:2}.core{fill:#12313a;stroke:#39c9bf;stroke-width:2.5}.ui{fill:#2a2021;stroke:#ef725e;stroke-width:2}.test{fill:#1c2533;stroke:#869cab;stroke-width:2}.t{font:700 18px Inter,Segoe UI,sans-serif;fill:#f5f8fa}.s{font:14px Inter,Segoe UI,sans-serif;fill:#b5c5d0}.line{fill:none;stroke:#6f899a;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="860" fill="url(#bg)"/><text x="70" y="68" class="h">ARGUS MODULE OWNERSHIP MAP</text><text x="70" y="99" class="sub">Change locally • review explicit contracts • verify cross-module consumers</text>
  <text x="95" y="153" class="head">BACKEND OWNER</text><text x="610" y="153" class="head">FRONTEND OWNER</text><text x="1095" y="153" class="head">VALIDATION &amp; RUNTIME</text>
  <g><rect x="70" y="180" width="430" height="112" rx="16" class="core"/><text x="95" y="216" class="t">Core CTI platform</text><text x="95" y="244" class="s">backend/arguswatch</text><text x="95" y="269" class="s">Auth • customers • collection • findings • risk</text><rect x="580" y="180" width="410" height="112" rx="16" class="ui"/><text x="605" y="216" class="t">Main dashboard</text><text x="605" y="244" class="s">backend/arguswatch/static</text><text x="605" y="269" class="s">Product shell and operational views</text><rect x="1070" y="180" width="460" height="112" rx="16" class="test"/><text x="1095" y="216" class="t">Core test suite</text><text x="1095" y="244" class="s">backend/tests/test_*</text><text x="1095" y="269" class="s">backend • worker • scheduler</text><path d="M500 236H570M990 236H1060" class="line"/></g>
  <g><rect x="70" y="320" width="430" height="112" rx="16" class="core"/><text x="95" y="356" class="t">Breach intelligence</text><text x="95" y="384" class="s">backend/modules/breach</text><text x="95" y="409" class="s">Search • pivots • cache • connection graph</text><rect x="580" y="320" width="410" height="112" rx="16" class="ui"/><text x="605" y="356" class="t">Breach workspace</text><text x="605" y="384" class="s">modules-ui/src/modules/breach</text><text x="605" y="409" class="s">Search, results, readable graph controls</text><rect x="1070" y="320" width="460" height="112" rx="16" class="test"/><text x="1095" y="356" class="t">Breach validation</text><text x="1095" y="384" class="s">Infrastructure + API smoke tests</text><text x="1095" y="409" class="s">backend • breach-search • tools-profile ingest</text><path d="M500 376H570M990 376H1060" class="line"/></g>
  <g><rect x="70" y="460" width="430" height="112" rx="16" class="core"/><text x="95" y="496" class="t">OSINT investigation</text><text x="95" y="524" class="s">backend/modules/osint</text><text x="95" y="549" class="s">Evidence tiers • jobs • correlation • export</text><rect x="580" y="460" width="410" height="112" rx="16" class="ui"/><text x="605" y="496" class="t">OSINT workspace</text><text x="605" y="524" class="s">modules-ui/src/modules/osint</text><text x="605" y="549" class="s">Submission, progress, evidence, graph</text><rect x="1070" y="460" width="460" height="112" rx="16" class="test"/><text x="1095" y="496" class="t">OSINT validation</text><text x="1095" y="524" class="s">API/integration tests + frontend build</text><text x="1095" y="549" class="s">backend process; external sources are mocked in CI</text><path d="M500 516H570M990 516H1060" class="line"/></g>
  <g><rect x="70" y="600" width="430" height="112" rx="16" class="core"/><text x="95" y="636" class="t">Image intelligence</text><text x="95" y="664" class="s">backend/modules/image_intel</text><text x="95" y="689" class="s">Metadata • OCR • vision • reverse search • geo</text><rect x="580" y="600" width="410" height="112" rx="16" class="ui"/><text x="605" y="636" class="t">Image workspace</text><text x="605" y="664" class="s">modules-ui/src/modules/image-intelligence</text><text x="605" y="689" class="s">Upload, provider status, jobs, evidence</text><rect x="1070" y="600" width="460" height="112" rx="16" class="test"/><text x="1095" y="636" class="t">Image validation</text><text x="1095" y="664" class="s">test_image_intel.py + frontend checks</text><text x="1095" y="689" class="s">backend • worker • image-intel volume</text><path d="M500 656H570M990 656H1060" class="line"/></g>
  <rect x="70" y="754" width="1460" height="58" rx="16" class="box"/><text x="800" y="780" text-anchor="middle" class="t">Shared boundaries: authenticated HTTP • visualization • core models/services • Docker topology • setup lifecycle</text><text x="800" y="802" text-anchor="middle" class="s">Extract only proven shared behavior; keep domain logic with its owning module.</text>
</svg>
