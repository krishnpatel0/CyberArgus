<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Argus developer workflow</title><desc id="desc">A developer selects an owning module, changes code and tests locally, updates contracts, runs the quality gate, and opens a reviewed pull request.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#121f2d"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c98a8"/></marker><style>.h{font:700 32px Inter,Segoe UI,sans-serif;fill:#f7fafc}.sub{font:16px Inter,Segoe UI,sans-serif;fill:#9fb2c3}.box{fill:#142636;stroke:#375269;stroke-width:2}.active{fill:#123038;stroke:#39c9bf;stroke-width:2.5}.review{fill:#2b2021;stroke:#ed735f;stroke-width:2.5}.t{font:700 18px Inter,Segoe UI,sans-serif;fill:#f7fafc}.s{font:14px Inter,Segoe UI,sans-serif;fill:#b7c6d0}.line{fill:none;stroke:#7c98a8;stroke-width:2.5;marker-end:url(#a)}.loop{fill:none;stroke:#ed735f;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="620" fill="url(#bg)"/><text x="70" y="66" class="h">CONTRIBUTOR WORKFLOW</text><text x="70" y="97" class="sub">Clear ownership without duplicating runtime or platform infrastructure</text>
  <path d="M310 262H370M640 262H700M970 262H1030M1300 262H1360" class="line"/>
  <g><rect x="70" y="182" width="240" height="160" rx="18" class="active"/><text x="190" y="224" text-anchor="middle" class="t">1. Locate owner</text><text x="190" y="256" text-anchor="middle" class="s">MODULES.md</text><text x="190" y="280" text-anchor="middle" class="s">module README</text><text x="190" y="304" text-anchor="middle" class="s">module.yaml</text></g>
  <g><rect x="370" y="182" width="270" height="160" rx="18" class="box"/><text x="505" y="224" text-anchor="middle" class="t">2. Make a focused change</text><text x="505" y="256" text-anchor="middle" class="s">Domain code stays local</text><text x="505" y="280" text-anchor="middle" class="s">Shared code has consumers</text><text x="505" y="304" text-anchor="middle" class="s">No module-local stack</text></g>
  <g><rect x="700" y="182" width="270" height="160" rx="18" class="box"/><text x="835" y="224" text-anchor="middle" class="t">3. Verify contracts</text><text x="835" y="256" text-anchor="middle" class="s">Tests + API behavior</text><text x="835" y="280" text-anchor="middle" class="s">README + manifest</text><text x="835" y="304" text-anchor="middle" class="s">Security/data impact</text></g>
  <g><rect x="1030" y="182" width="270" height="160" rx="18" class="active"/><text x="1165" y="224" text-anchor="middle" class="t">4. Run quality gate</text><text x="1165" y="256" text-anchor="middle" class="s">Python tests + audit</text><text x="1165" y="280" text-anchor="middle" class="s">React lint + build</text><text x="1165" y="304" text-anchor="middle" class="s">Compose resolution</text></g>
  <g><rect x="1360" y="182" width="170" height="160" rx="18" class="review"/><text x="1445" y="224" text-anchor="middle" class="t">5. Review</text><text x="1445" y="256" text-anchor="middle" class="s">Module owner</text><text x="1445" y="280" text-anchor="middle" class="s">Cross-boundary</text><text x="1445" y="304" text-anchor="middle" class="s">maintainer</text></g>
  <path d="M1445 342V438H835V352" class="loop"/><text x="1140" y="426" text-anchor="middle" class="s">requested changes return to implementation and verification</text>
  <rect x="240" y="486" width="1120" height="72" rx="18" fill="#0d1926" stroke="#2c4354" stroke-width="2"/><text x="800" y="516" text-anchor="middle" class="t">Merge condition</text><text x="800" y="542" text-anchor="middle" class="s">green CI • reviewed module contracts • sanitized evidence • no live data or credentials • migration/rollback stated</text>
</svg>
