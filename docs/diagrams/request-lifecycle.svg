<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Argus request lifecycle</title><desc id="desc">A request flows through authentication, validation and scope control, domain execution, bounded dependencies, persistence, and an auditable response.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#121f2d"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7f9cac"/></marker><style>.h{font:700 32px Inter,Segoe UI,sans-serif;fill:#f7fafc}.sub{font:16px Inter,Segoe UI,sans-serif;fill:#9fb2c3}.box{fill:#142636;stroke:#375269;stroke-width:2}.guard{fill:#123038;stroke:#39c9bf;stroke-width:2.5}.domain{fill:#2b2021;stroke:#ed735f;stroke-width:2.5}.t{font:700 17px Inter,Segoe UI,sans-serif;fill:#f7fafc}.s{font:14px Inter,Segoe UI,sans-serif;fill:#b7c6d0}.n{font:700 13px Inter,Segoe UI,sans-serif;fill:#07111d}.line{fill:none;stroke:#7f9cac;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="560" fill="url(#bg)"/><text x="70" y="66" class="h">REQUEST LIFECYCLE</text><text x="70" y="96" class="sub">Every public operation crosses the same product and audit boundary</text>
  <path d="M242 278H298M512 278H568M782 278H838M1052 278H1108M1322 278H1378" class="line"/>
  <g><circle cx="84" cy="160" r="18" fill="#39c9bf"/><text x="84" y="165" text-anchor="middle" class="n">01</text><rect x="70" y="184" width="172" height="188" rx="18" class="box"/><text x="156" y="228" text-anchor="middle" class="t">Receive</text><text x="156" y="258" text-anchor="middle" class="s">Browser or API</text><text x="156" y="281" text-anchor="middle" class="s">request</text><text x="156" y="323" text-anchor="middle" class="s">Request ID</text><text x="156" y="346" text-anchor="middle" class="s">size limits</text></g>
  <g><circle cx="326" cy="160" r="18" fill="#39c9bf"/><text x="326" y="165" text-anchor="middle" class="n">02</text><rect x="298" y="184" width="214" height="188" rx="18" class="guard"/><text x="405" y="228" text-anchor="middle" class="t">Authenticate</text><text x="405" y="258" text-anchor="middle" class="s">JWT / configured key</text><text x="405" y="281" text-anchor="middle" class="s">role policy</text><text x="405" y="323" text-anchor="middle" class="s">Fail closed</text><text x="405" y="346" text-anchor="middle" class="s">when enabled</text></g>
  <g><circle cx="596" cy="160" r="18" fill="#39c9bf"/><text x="596" y="165" text-anchor="middle" class="n">03</text><rect x="568" y="184" width="214" height="188" rx="18" class="guard"/><text x="675" y="228" text-anchor="middle" class="t">Validate &amp; scope</text><text x="675" y="258" text-anchor="middle" class="s">Schema • allowlist</text><text x="675" y="281" text-anchor="middle" class="s">customer ownership</text><text x="675" y="323" text-anchor="middle" class="s">Reject unsafe or</text><text x="675" y="346" text-anchor="middle" class="s">unbounded work</text></g>
  <g><circle cx="866" cy="160" r="18" fill="#ed735f"/><text x="866" y="165" text-anchor="middle" class="n">04</text><rect x="838" y="184" width="214" height="188" rx="18" class="domain"/><text x="945" y="228" text-anchor="middle" class="t">Execute module</text><text x="945" y="258" text-anchor="middle" class="s">Core / breach / OSINT</text><text x="945" y="281" text-anchor="middle" class="s">image / Telegram</text><text x="945" y="323" text-anchor="middle" class="s">Sync response or</text><text x="945" y="346" text-anchor="middle" class="s">queued job</text></g>
  <g><circle cx="1136" cy="160" r="18" fill="#ed735f"/><text x="1136" y="165" text-anchor="middle" class="n">05</text><rect x="1108" y="184" width="214" height="188" rx="18" class="box"/><text x="1215" y="228" text-anchor="middle" class="t">Bound dependencies</text><text x="1215" y="258" text-anchor="middle" class="s">Timeout • retry cap</text><text x="1215" y="281" text-anchor="middle" class="s">query parameters</text><text x="1215" y="323" text-anchor="middle" class="s">Explicit partial and</text><text x="1215" y="346" text-anchor="middle" class="s">unavailable states</text></g>
  <g><circle cx="1406" cy="160" r="18" fill="#39c9bf"/><text x="1406" y="165" text-anchor="middle" class="n">06</text><rect x="1378" y="184" width="152" height="188" rx="18" class="guard"/><text x="1454" y="228" text-anchor="middle" class="t">Respond</text><text x="1454" y="258" text-anchor="middle" class="s">Normalize</text><text x="1454" y="281" text-anchor="middle" class="s">persist</text><text x="1454" y="323" text-anchor="middle" class="s">audit</text><text x="1454" y="346" text-anchor="middle" class="s">return</text></g>
  <rect x="228" y="424" width="1144" height="70" rx="18" fill="#0d1926" stroke="#2c4354" stroke-width="2"/><text x="800" y="453" text-anchor="middle" class="t">Cross-cutting controls</text><text x="800" y="478" text-anchor="middle" class="s">provenance • secrets isolation • rate limits • bounded graph expansion • retention • structured logs • kill switches</text>
</svg>
