global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
 - "alert_rules.yml"

alerting:
  alertmanagers:
   - static_configs:
       - targets: []  # Add alertmanager:9093 when ready

scrape_configs:
  - job_name: "argus-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
